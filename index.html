<!-- @format -->

<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Algo text</title>
  </head>
  <body>
    <header>
      <h1>Exercices d'algorithme</h1>
    </header>
    <main>
      <section class="container-algo">
        <button onclick="carre()">Algo 1 - Le carre</button>
        <p id="resultatcarre"></p>
      </section>
      <section class="container-algo">
        <button onclick="somme()">Algo 2 - La somme</button>
        <p id="resultatsomme"></p>
      </section>

      <section class="container-algo">
        <button onclick="allPair()">
          Algo 3 - Ensemble des nombres pairs de 0 à saisie
        </button>
        <p id="resultatallPair"></p>
      </section>

      <section class="container-algo">
        <button onclick="allPrimes()">
          Algo 4 - Ensemble des nombres premiers de 0 à saisie
        </button>
        <p id="resultatallPrimes"></p>
      </section>
      <section class="container-algo">
        <button onclick="tableMulti()">Algo 5 - Table de multiplication</button>
        <p id="resultattableMulti"></p>
      </section>
      <section class="container-algo">
        <button onclick="factoriel()">Algo 6 - factoriel</button>
        <p id="resultatfactoriel"></p>
      </section>
      <section class="container-algo">
        <button onclick="inverse()">Algo 7 - L'inverse</button>
        <p id="resultatInvers"></p>
      </section>
      <section class="container-algo">
        <button onclick="plusGrandDiv()">Algo 8 - Plus grand diviseur</button>
        <p id="resultatplusGrand"></p>
      </section>
      <section class="container-algo">
        <button onclick="plusPetitDiv()">Algo 9 - Plus petit diviseur</button>
        <p id="resultatplusPetit"></p>
      </section>
    </main>

    <script src="js/text/algo.js"></script>
  </body>
</html>
